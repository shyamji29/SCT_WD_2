<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the website responsive on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Stopwatch</title>

    <!-- Connecting CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main container -->
    <div class="container">

        <!-- Heading -->
        <h1>Stopwatch</h1>

        <p class="subtitle">
            Simple Stopwatch Web Application
        </p>


        <!-- Stopwatch Display -->
        <div class="stopwatch">

            <div id="display">
                00:00:00
            </div>

        </div>


        <!-- Buttons -->
        <div class="buttons">

            <button id="startBtn">
                Start
            </button>

            <button id="pauseBtn">
                Pause
            </button>

            <button id="lapBtn">
                Lap
            </button>

            <button id="resetBtn">
                Reset
            </button>

        </div>


        <!-- Lap Section -->
        <div class="lap-section">

            <h2>Lap Times</h2>

            <ul id="lapList">
                <!-- Lap times will appear here -->
            </ul>

        </div>

    </div>


    <!-- Connecting JavaScript file -->
    <script src="script.js"></script>

</body>

</html>
